name: Generate Ultra-Fast Reference Dobutsu Tablebase

# Expensive exhaustive generation is manually dispatched only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dobutsu-reference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-validate-c:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned BSD-licensed reference C solver
        run: |
          git clone --no-tags https://github.com/clausecker/dobutsu.git reference-dobutsu
          git -C reference-dobutsu checkout dfcf133355c80ccc85ae61b9c8ed864b316ac809
          test "$(git -C reference-dobutsu rev-parse HEAD)" = dfcf133355c80ccc85ae61b9c8ed864b316ac809
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends liblzma-dev
      - name: Build optimized C generator and exhaustive validator
        run: |
          make -C reference-dobutsu -j 2 gentb validatetb \
            CC="gcc -std=c99" RLCFLAGS="" RLLDFLAGS="" RLLDLIBS="" \
            INTLCFLAGS="" INTLLDFLAGS="" INTLLDLIBS="" \
            LZMACFLAGS="" LZMALDFLAGS="" LZMALDLIBS="-llzma"
      - name: Compute complete reference table
        run: |
          set -o pipefail
          mkdir -p ref-result
          ./reference-dobutsu/gentb -j 2 ref-result/clausecker.tb 2>&1 | tee ref-result/generate.log
          test "$(stat -c %s ref-result/clausecker.tb)" -eq 167527962
      - name: Exhaustively validate reference table
        run: |
          set -o pipefail
          ./reference-dobutsu/validatetb ref-result/clausecker.tb 2>&1 | tee ref-result/validate.log
      - name: Wrap DTM bytes without modification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, struct
          original=Path("ref-result/clausecker.tb")
          dest=Path("ref-result/dobutsu.ref")
          assert original.stat().st_size == 167_527_962
          with original.open("rb") as source, dest.open("wb") as out:
              out.write(b"DOBREF01" + struct.pack("<Q",167_527_962))
              shutil.copyfileobj(source,out)
          assert dest.stat().st_size == 167_527_978
          PY
          tail -c +17 ref-result/dobutsu.ref | cmp - ref-result/clausecker.tb
          sha256sum ref-result/dobutsu.ref > ref-result/SHA256SUMS
      - name: Preserve C-validated table for Rust verifier
        uses: actions/upload-artifact@v4
        with:
          name: dobutsu-c-validated-pending-rust
          path: |
            ref-result/dobutsu.ref
            ref-result/SHA256SUMS
            ref-result/generate.log
            ref-result/validate.log
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
      - name: Upload diagnostic logs on C generation failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dobutsu-reference-c-failure-logs
          path: |
            ref-result/generate.log
            ref-result/validate.log
          if-no-files-found: ignore
          retention-days: 1

  verify-rust-abi:
    needs: generate-and-validate-c
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run cross-format index and DTM regression tests
        run: cargo test --all-features --manifest-path engine/Cargo.toml
      - name: Restore C-validated table
        uses: actions/download-artifact@v4
        with:
          name: dobutsu-c-validated-pending-rust
          path: ref-result
      - name: Verify SHA256 and Rust WDL/DTM probe
        run: |
          sha256sum --check ref-result/SHA256SUMS
          cargo run --release --bin verify-reference --manifest-path engine/Cargo.toml -- ref-result/dobutsu.ref
      - name: Confirm full cross-language verification
        run: echo "Exact C generation, exhaustive C verification and Rust probe verification passed."
