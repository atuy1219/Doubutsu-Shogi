name: Build Dobutsu Eval Overlay

on:
  push:
    paths:
      - "app/**"
      - "engine/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/wrapper/**"
  pull_request:
    paths:
      - "app/**"
      - "engine/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/wrapper/**"
      - ".github/workflows/build-dobutsu-eval.yml"
  workflow_run:
    workflows: ["Publish Complete Dobutsu Tablebase"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - name: Ensure the source tree contains the fixed tablebase
        run: |
          if [ ! -s app/src/main/assets/dobutsu.tablebase ]; then
            git fetch --no-tags origin main
            mkdir -p app/src/main/assets
            git show origin/main:app/src/main/assets/dobutsu.ref.gz > app/src/main/assets/dobutsu.ref.gz
          fi
      - name: Verify source tablebase
        run: |
          test "$(stat -c %s app/src/main/assets/dobutsu.ref.gz)" -lt 100000000
          gzip -t app/src/main/assets/dobutsu.ref.gz
          actual="$(gzip -dc app/src/main/assets/dobutsu.ref.gz | sha256sum | cut -d' ' -f1)"
          test "$actual" = "95936ff86f6cc4958e39e8d98bc82fef304315985ce34a8bb26602f4d89acabb"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.1"
      - name: Install Android SDK / NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.22.1"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Rust engine unit tests
        run: cargo test --all-features --manifest-path engine/Cargo.toml
      - name: Exercise offline WDL/DTM generator
        run: |
          cargo run --release --features generator --manifest-path engine/Cargo.toml --bin generate -- --terminal-fixture --max-states 1 --output /tmp/dobutsu-terminal-fixture.tb
          test -s /tmp/dobutsu-terminal-fixture.tb
      - name: Verify lossless table packing
        shell: bash
        run: |
          cargo build --release --features full-solver --bin pack-full --manifest-path engine/Cargo.toml
          python3 - <<'PY'
          from pathlib import Path
          b = Path('/tmp/dobutsu-terminal-fixture.tb').read_bytes()
          assert b[:8] == b'DOBUTB01'
          assert int.from_bytes(b[8:16], 'little') == 1
          k = int.from_bytes(b[16:32], 'little')
          assert k < 2**64
          outcome = b[32]
          dtm = int.from_bytes(b[33:35], 'little')
          value = (dtm+1 if outcome == 1 else -(dtm+1)) if outcome != 3 else 32767
          row = b'DOBUTB02' + (1).to_bytes(8,'little') + k.to_bytes(8,'little') + value.to_bytes(2,'little',signed=True)
          Path('/tmp/dobutsu-terminal-fixture-v2.tb').write_bytes(row)
          PY
          engine/target/release/pack-full /tmp/dobutsu-terminal-fixture-v2.tb /tmp/dobutsu-terminal-fixture.tbx
          test -s /tmp/dobutsu-terminal-fixture.tbx
      - name: Cross-compile Rust engine for Android ARM64
        shell: bash
        run: |
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
          test -x "$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          cargo build --release --lib --target aarch64-linux-android --manifest-path engine/Cargo.toml
          test -s engine/target/aarch64-linux-android/release/libdobutsu_solver.a
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: List packaged assets
        run: |
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Ei 'dobutsu|license|notice' || true
      - name: Verify exact tablebase embedded in APK
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test "$(stat -c %s "$apk")" -gt 20000000
          entry="assets/dobutsu.tablebase"
          unzip -Z1 "$apk" | grep -Fx "$entry"
          unzip -p "$apk" "$entry" | gzip -t
          actual="$(unzip -p "$apk" "$entry" | gzip -dc | sha256sum | cut -d' ' -f1)"
          test "$actual" = "95936ff86f6cc4958e39e8d98bc82fef304315985ce34a8bb26602f4d89acabb"
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: DobutsuEvalOverlay-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
